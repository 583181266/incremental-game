<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>像素菜园 · 种菜增量游戏</title>
<style>
  :root{
    --ink:#20242b; --paper:#f7ead1; --panel:#fff6e3; --line:#20242b;
    --grass:#58a447; --grass-d:#3d7a30; --soil:#8a5a2b; --soil-d:#6f4520;
    --gold:#e8a812; --sky:#7ec8e3; --red:#d94f3d; --purple:#7a4fd0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; border-radius:0 !important;}
  body{margin:0; font-family:"Courier New","PingFang SC","Microsoft YaHei",monospace; color:var(--ink);
    background:#79a83b repeating-conic-gradient(#00000010 0% 25%, transparent 0% 50%) 0 0/24px 24px;}
  header{position:sticky; top:0; z-index:5; background:var(--sky); border-bottom:4px solid var(--ink); padding:12px 16px 10px;
    box-shadow:0 4px 0 #00000030;}
  .coins{font-size:29px; font-weight:900; color:#7a4d00; text-shadow:2px 2px 0 #ffffff90; line-height:1.1;}
  .sub{color:#22303c; font-size:13px; font-weight:700; margin-top:3px;}
  .sub b{color:#a33c00;}
  .weather{display:inline-block; margin-top:7px; background:#fff; border:3px solid var(--ink); box-shadow:3px 3px 0 var(--ink); padding:3px 9px; font-size:13px; font-weight:900;}
  main{max-width:640px; margin:0 auto; padding:14px 12px 44px;}
  .plot{background:
      repeating-linear-gradient(0deg, transparent 0 22px, #00000022 22px 24px),
      repeating-linear-gradient(90deg, transparent 0 22px, #00000022 22px 24px),
      linear-gradient(180deg, var(--soil), var(--soil-d));
    border:4px solid var(--ink); box-shadow:6px 6px 0 #00000055; padding:18px 10px 14px; text-align:center;}
  #plotBtn{width:168px; height:168px; font-size:84px; line-height:1; background:#a9743a; border:4px solid var(--ink);
    box-shadow:0 6px 0 var(--ink); cursor:pointer; image-rendering:pixelated; transition:transform .05s;}
  #plotBtn:active{transform:translateY(4px); box-shadow:0 2px 0 var(--ink);}
  .plotHint{color:#ffe9bd; font-weight:900; font-size:14px; margin-top:12px; text-shadow:2px 2px 0 #00000070;}
  .floatNum{position:fixed; z-index:9; font-weight:900; font-size:20px; color:#fff; text-shadow:2px 2px 0 var(--ink); pointer-events:none; animation:rise 1s steps(8) forwards;}
  .floatVeg{position:fixed; z-index:9; font-size:30px; pointer-events:none; animation:rise 1.1s steps(10) forwards;}
  @keyframes rise{from{opacity:1; transform:translateY(0)} to{opacity:0; transform:translateY(-76px)}}
  .buyModes{display:flex; gap:8px; margin:14px 0 4px;}
  .buyModes button{flex:1; padding:9px 0; border:3px solid var(--ink); background:var(--panel); color:var(--ink); font-size:15px; font-weight:900; cursor:pointer; box-shadow:3px 3px 0 var(--ink);}
  .buyModes button.on{background:var(--gold); color:#fff; text-shadow:1px 1px 0 #00000060;}
  h2{font-size:17px; margin:24px 0 10px; background:var(--panel); display:inline-block; border:3px solid var(--ink); box-shadow:3px 3px 0 var(--ink); padding:3px 10px;}
  .card{display:flex; align-items:center; gap:11px; background:var(--panel); border:3px solid var(--ink); box-shadow:4px 4px 0 #00000040; padding:10px 12px; margin-bottom:9px;}
  .card .sprite{font-size:34px; width:46px; text-align:center; image-rendering:pixelated;}
  .card .info{flex:1; min-width:0;}
  .card .name{font-weight:900; font-size:15px;}
  .card .desc{color:#5a4632; font-size:12px; font-weight:700; margin-top:2px; line-height:1.5;}
  .badge{display:inline-block; background:var(--red); color:#fff; font-size:11px; padding:1px 6px; border:2px solid var(--ink); margin-left:6px; vertical-align:1px;}
  .card .own{font-size:24px; font-weight:900; color:#8a6d1f; min-width:36px; text-align:center;}
  .buyBtn{border:3px solid var(--ink); padding:8px 11px; font-size:14px; font-weight:900; background:var(--grass); color:#fff; text-shadow:1px 1px 0 #00000055; cursor:pointer; white-space:nowrap; box-shadow:3px 3px 0 var(--ink);}
  .buyBtn:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink);}
  .buyBtn:disabled{background:#b9b0a0; color:#6f6a5e; cursor:not-allowed; box-shadow:3px 3px 0 #77705f;}
  .buyBtn small{display:block; font-weight:700; font-size:11px; opacity:.9;}
  .upBtn{background:#2e7fb8;}
  .fest{background:linear-gradient(135deg,#ffe9a8,#ffd34d); border:4px solid var(--ink); box-shadow:5px 5px 0 #00000040; padding:15px;}
  .fest .big{font-size:19px; font-weight:900; color:#7a2d8a;}
  #festBtn{margin-top:10px; width:100%; padding:12px; border:3px solid var(--ink); background:var(--purple); color:#fff; font-size:16px; font-weight:900; cursor:pointer; box-shadow:4px 4px 0 var(--ink); text-shadow:1px 1px 0 #00000055;}
  #festBtn:disabled{background:#b9b0a0; color:#6f6a5e; cursor:not-allowed;}
  .stats{color:#3c3226; font-size:13px; font-weight:700; line-height:1.9; background:var(--panel); border:3px solid var(--ink); padding:10px 13px; box-shadow:4px 4px 0 #00000040;}
  .stats b{color:#a33c00;}
  .danger{background:#fff; border:3px solid var(--red); color:var(--red); font-weight:900; padding:8px 14px; cursor:pointer; margin-top:14px;}
  .guide{background:var(--panel); border:3px solid var(--ink); box-shadow:4px 4px 0 #00000040; padding:6px 14px; font-size:13px; font-weight:700; line-height:2;}
  #modal{position:fixed; inset:0; background:rgba(20,16,8,.66); display:none; align-items:center; justify-content:center; z-index:20;}
  #modal .box{background:var(--paper); border:4px solid var(--ink); box-shadow:6px 6px 0 #000; padding:24px; max-width:320px; text-align:center;}
  #modal button{margin-top:14px; padding:10px 26px; border:3px solid var(--ink); background:var(--grass); color:#fff; font-size:15px; font-weight:900; cursor:pointer; box-shadow:3px 3px 0 var(--ink);}
  .hidden{display:none !important;}
</style>
</head>
<body>
<header>
  <div class="coins">🪙 <span id="coins">0</span> 金币</div>
  <div class="sub">每秒收获 <b id="cps">0</b> · 每次采摘 <b id="clickVal">1</b> · 金种子 <b id="seeds">0</b>（产量 +<span id="seedBonus">0</span>%）</div>
  <div class="weather" id="weather"></div>
</header>
<main>
  <div class="plot">
    <button id="plotBtn" title="采摘">🌱</button>
    <div class="plotHint">点这块地，亲手采摘赚钱！</div>
  </div>

  <div class="buyModes" id="buyModes">
    <button data-n="1" class="on">×1</button>
    <button data-n="10">×10</button>
    <button data-n="100">×100</button>
    <button data-n="max">买满</button>
  </div>

  <h2>🌻 我的菜园</h2>
  <div id="crops"></div>

  <h2>🧰 农具与技术</h2>
  <div id="upgrades"></div>
  <div id="noUpgrades" class="sub">暂无新技术（多种菜、多赚钱就能解锁）</div>

  <h2>🎪 丰收祭</h2>
  <div class="fest">
    <div class="big">可换金种子：<span id="pendingSeeds">0</span> 颗</div>
    <div class="sub" style="margin-top:6px">把这一季的收成献给丰收祭，换回金种子：金币和菜园会清空重来，但每颗金种子永久 +5% 产量。这一季赚得越多，换到的种子越多。</div>
    <button id="festBtn">开启丰收祭</button>
  </div>

  <h2>📖 菜园图鉴</h2>
  <div class="guide" id="guide"></div>

  <h2>📊 农场账本</h2>
  <div class="stats" id="stats"></div>
  <button class="danger" id="wipeBtn">烧掉重种（删除存档）</button>
</main>

<div id="modal"><div class="box">
  <div style="font-size:18px;font-weight:900">🌅 天亮了！</div>
  <div class="sub" style="margin-top:8px">你不在的 <span id="offTime"></span> 里，菜园自己长势喜人，收获了</div>
  <div style="font-size:24px;font-weight:900;color:#a33c00;margin-top:6px">🪙 <span id="offGain"></span> 金币</div>
  <button id="offOk">收下</button>
</div></div>

<script>
"use strict";
/* ===== 作物表：8 种作物，价格 ×1.15 指数增长 ===== */
const CROPS = [
  { id:"carrot",  name:"胡萝卜田", icon:"🥕", baseCost:15,       baseCps:0.1,  desc:"兔子最爱，新农人的第一课，拔出来还带泥香。" },
  { id:"cabbage", name:"卷心菜地", icon:"🥬", baseCost:100,      baseCps:1,    desc:"一层裹一层，包住了整个冬天的踏实。" },
  { id:"tomato",  name:"番茄架",   icon:"🍅", baseCost:1100,     baseCps:8,    desc:"红透了才摘，酸甜的价钱最好。" },
  { id:"corn",    name:"玉米田",   icon:"🌽", baseCost:12000,    baseCps:47,   desc:"一人多高，风一过哗哗响，像在数钱。" },
  { id:"pumpkin", name:"南瓜园",   icon:"🎃", baseCost:130000,   baseCps:260,  desc:"一个顶十个，万圣节前最抢手。" },
  { id:"melon",   name:"西瓜棚",   icon:"🍉", baseCost:1400000,  baseCps:1400, desc:"敲一敲，脆响的就是好瓜，夏天的硬通货。" },
  { id:"berry",   name:"草莓大棚", icon:"🍓", baseCost:20000000, baseCps:7800, desc:"娇贵但值钱，城里甜品店排队来收。" },
  { id:"wheat",   name:"黄金麦田", icon:"🌾", baseCost:330000000,baseCps:44000,desc:"风吹麦浪金满地，菜园的终极浪漫。" },
];
const COST_GROWTH = 1.15;

/* 升级：click 采摘强化 / crop 单种作物翻倍 / global 全园翻倍 */
const UPGRADES = [
  { id:"hoe1", name:"精铁锄头",   desc:"采摘收益 ×2",         cost:100,       type:"click", mult:2, cond:s=>true },
  { id:"hoe2", name:"顺手镰刀",   desc:"采摘收益 ×2",         cost:5000,      type:"click", mult:2, cond:s=>s.stats.totalClicks>=200 },
  { id:"hoe3", name:"金柄锄头",   desc:"采摘收益 ×2",         cost:500000,    type:"click", mult:2, cond:s=>s.stats.totalClicks>=800 },
  { id:"u_carrot",  name:"有机肥",     desc:"胡萝卜田产量 ×2", cost:1000,      type:"crop", target:"carrot",  mult:2, cond:s=>s.owned.carrot>=10 },
  { id:"u_cabbage", name:"进口菜种",   desc:"卷心菜地产量 ×2", cost:8000,      type:"crop", target:"cabbage", mult:2, cond:s=>s.owned.cabbage>=10 },
  { id:"u_tomato",  name:"番茄支架",   desc:"番茄架产量 ×2",   cost:60000,     type:"crop", target:"tomato",  mult:2, cond:s=>s.owned.tomato>=10 },
  { id:"u_corn",    name:"密植技术",   desc:"玉米田产量 ×2",   cost:600000,    type:"crop", target:"corn",    mult:2, cond:s=>s.owned.corn>=10 },
  { id:"u_pumpkin", name:"嫁接南瓜",   desc:"南瓜园产量 ×2",   cost:6000000,   type:"crop", target:"pumpkin", mult:2, cond:s=>s.owned.pumpkin>=10 },
  { id:"u_melon",   name:"滴灌系统",   desc:"西瓜棚产量 ×2",   cost:60000000,  type:"crop", target:"melon",   mult:2, cond:s=>s.owned.melon>=10 },
  { id:"u_berry",   name:"恒温大棚",   desc:"草莓大棚产量 ×2", cost:800000000, type:"crop", target:"berry",   mult:2, cond:s=>s.owned.berry>=10 },
  { id:"u_wheat",   name:"联合收割机", desc:"黄金麦田产量 ×2", cost:9000000000,type:"crop", target:"wheat",   mult:2, cond:s=>s.owned.wheat>=10 },
  { id:"g1", name:"菜市场摊位", desc:"全园产量 ×2", cost:200000,     type:"global", mult:2, cond:s=>s.stats.runEarned>=100000 },
  { id:"g2", name:"农家乐招牌", desc:"全园产量 ×2", cost:50000000,   type:"global", mult:2, cond:s=>s.stats.runEarned>=20000000 },
  { id:"g3", name:"出口订单",   desc:"全园产量 ×2", cost:2000000000, type:"global", mult:2, cond:s=>s.stats.runEarned>=1000000000 },
];

/* 每日天气：按日期轮换一种作物大丰收 +50% */
const WEATHERS = [
  { name:"晴空万里", icon:"☀️" }, { name:"春雨绵绵", icon:"🌧️" },
  { name:"微风拂面", icon:"🍃" }, { name:"暖阳高照", icon:"🌤️" },
  { name:"细雨润田", icon:"🌦️" }, { name:"金风送爽", icon:"🌬️" },
  { name:"艳阳似火", icon:"🔆" }, { name:"晨露晶莹", icon:"💧" },
];
function weatherCropIdx(){
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  return Math.floor((now - start) / 86400000) % CROPS.length;
}

const SAVE_KEY = "pixel-farm-v1";
const OFFLINE_CAP_SEC = 8 * 3600;

function freshState(){
  const owned = {}; CROPS.forEach(c=>owned[c.id]=0);
  return { v:1, coins:0, seeds:0, owned, upgrades:[],
    stats:{ totalEarned:0, runEarned:0, totalClicks:0, fests:0, playSec:0 }, lastTime:Date.now() };
}
let S = freshState();

function save(){ S.lastTime = Date.now(); try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return 0;
    const d = JSON.parse(raw);
    if(!d || d.v !== 1) return 0;
    S = Object.assign(freshState(), d);
    S.owned = Object.assign(freshState().owned, d.owned||{});
    S.stats = Object.assign(freshState().stats, d.stats||{});
    const away = Math.min((Date.now() - (d.lastTime||Date.now()))/1000, OFFLINE_CAP_SEC);
    const gain = cps() * away;
    if(away > 60 && gain > 0){
      S.coins += gain; S.stats.totalEarned += gain; S.stats.runEarned += gain;
      return { away, gain };
    }
  }catch(e){}
  return 0;
}

/* ===== 计算 ===== */
function cropMult(id){
  let m = 1;
  UPGRADES.forEach(u=>{ if(u.type==="crop" && u.target===id && S.upgrades.includes(u.id)) m *= u.mult; });
  if(CROPS[weatherCropIdx()].id === id) m *= 1.5;
  return m;
}
function globalMult(){
  let m = 1 + S.seeds * 0.05;
  UPGRADES.forEach(u=>{ if(u.type==="global" && S.upgrades.includes(u.id)) m *= u.mult; });
  return m;
}
function cps(){
  let sum = 0;
  CROPS.forEach(c=>{ sum += S.owned[c.id] * c.baseCps * cropMult(c.id); });
  return sum * globalMult();
}
function clickValue(){
  let m = 1;
  UPGRADES.forEach(u=>{ if(u.type==="click" && S.upgrades.includes(u.id)) m *= u.mult; });
  return m * globalMult();
}
function unitCost(c){ return c.baseCost * Math.pow(COST_GROWTH, S.owned[c.id]); }
function bulkCost(c, n){ const u = unitCost(c); return u * (Math.pow(COST_GROWTH, n) - 1) / (COST_GROWTH - 1); }
function maxAffordable(c){
  const u = unitCost(c);
  if(S.coins < u) return 0;
  return Math.max(0, Math.floor(Math.log((S.coins * (COST_GROWTH - 1)) / u + 1) / Math.log(COST_GROWTH)));
}
function pendingSeeds(){ return Math.floor(150 * Math.sqrt(S.stats.runEarned / 1e6)); }

/* ===== 格式化 ===== */
function fmt(n){
  if(n < 1000) return Math.floor(n).toString();
  const units = ["K","M","B","T","Qa","Qi","Sx","Sp"];
  let u = -1; while(n >= 1000 && u < units.length - 1){ n /= 1000; u++; }
  if(u >= units.length - 1 && n >= 1000) return n.toExponential(2).replace("e+","e");
  return (n >= 100 ? n.toFixed(0) : n >= 10 ? n.toFixed(1) : n.toFixed(2)) + units[u];
}
function fmtTime(sec){
  sec = Math.floor(sec);
  if(sec < 3600) return Math.floor(sec/60) + " 分钟";
  return Math.floor(sec/3600) + " 小时 " + Math.floor(sec%3600/60) + " 分钟";
}

/* ===== 渲染 ===== */
const $ = id => document.getElementById(id);
let buyN = 1;
const cropEls = {}, upEls = {};

function buildUI(){
  const wrap = $("crops");
  CROPS.forEach(c=>{
    const el = document.createElement("div"); el.className = "card";
    el.innerHTML = `<div class="sprite">${c.icon}</div>
      <div class="info"><div class="name">${c.name}<span class="badge hidden">大丰收 +50%</span></div>
      <div class="desc">${c.desc}<br>每块地每秒 +<span class="pcps"></span> 金币</div></div>
      <div class="own">0</div>
      <button class="buyBtn">买地<small></small></button>`;
    wrap.appendChild(el);
    cropEls[c.id] = { root:el, own:el.querySelector(".own"), btn:el.querySelector(".buyBtn"), pcps:el.querySelector(".pcps"), badge:el.querySelector(".badge") };
    el.querySelector(".buyBtn").addEventListener("click", ()=>buyCrop(c));
  });
  const uw = $("upgrades");
  UPGRADES.forEach(u=>{
    const el = document.createElement("div"); el.className = "card hidden";
    el.innerHTML = `<div class="sprite">🧰</div>
      <div class="info"><div class="name">${u.name}</div><div class="desc">${u.desc}</div></div>
      <button class="buyBtn upBtn">学习<small>${fmt(u.cost)} 金币</small></button>`;
    uw.appendChild(el);
    upEls[u.id] = el;
    el.querySelector(".buyBtn").addEventListener("click", ()=>buyUpgrade(u));
  });
  $("guide").innerHTML = CROPS.map(c=>`${c.icon} <b>${c.name}</b>：${c.desc}`).join("<br>");
  const w = WEATHERS[weatherCropIdx()], wc = CROPS[weatherCropIdx()];
  $("weather").textContent = `${w.icon} 今日${w.name} · ${wc.icon} ${wc.name}大丰收 +50%`;
}

function render(){
  $("coins").textContent = fmt(S.coins);
  $("cps").textContent = fmt(cps());
  $("clickVal").textContent = fmt(clickValue());
  $("seeds").textContent = S.seeds;
  $("seedBonus").textContent = S.seeds * 5;
  const wIdx = weatherCropIdx();
  CROPS.forEach((c, i)=>{
    const e = cropEls[c.id];
    const n = buyN === "max" ? Math.max(1, maxAffordable(c)) : buyN;
    const cost = bulkCost(c, n);
    e.own.textContent = S.owned[c.id];
    e.pcps.textContent = fmt(c.baseCps * cropMult(c.id) * globalMult());
    e.badge.classList.toggle("hidden", i !== wIdx);
    e.btn.querySelector("small").textContent = fmt(cost) + " 金币";
    e.btn.firstChild.textContent = "买地 ×" + n + " ";
    e.btn.disabled = buyN === "max" ? maxAffordable(c) < 1 : S.coins < cost;
  });
  let anyUp = false;
  UPGRADES.forEach(u=>{
    const el = upEls[u.id];
    const visible = !S.upgrades.includes(u.id) && u.cond(S);
    el.classList.toggle("hidden", !visible);
    if(visible){ anyUp = true; el.querySelector(".buyBtn").disabled = S.coins < u.cost; }
  });
  $("noUpgrades").style.display = anyUp ? "none" : "block";
  const ps = pendingSeeds();
  $("pendingSeeds").textContent = ps;
  $("festBtn").disabled = ps < 1;
  $("festBtn").textContent = ps < 1 ? "开启丰收祭（本季收入达到 1M 后解锁）" : `开启丰收祭，换 ${ps} 颗金种子`;
  $("stats").innerHTML =
    `本季累计收入 <b>${fmt(S.stats.runEarned)}</b> · 历史总收入 <b>${fmt(S.stats.totalEarned)}</b><br>` +
    `总采摘 <b>${S.stats.totalClicks}</b> 次 · 丰收祭 <b>${S.stats.fests}</b> 次 · 务农时长 <b>${fmtTime(S.stats.playSec)}</b>`;
}

/* ===== 操作 ===== */
function buyCrop(c){
  const n = buyN === "max" ? maxAffordable(c) : buyN;
  if(n < 1) return;
  const cost = bulkCost(c, n);
  if(S.coins < cost) return;
  S.coins -= cost; S.owned[c.id] += n; render();
}
function buyUpgrade(u){
  if(S.upgrades.includes(u.id) || S.coins < u.cost) return;
  S.coins -= u.cost; S.upgrades.push(u.id); render();
}
const VEG = ["🥕","🥬","🍅","🌽","🎃","🍉","🍓","🌾","🌱","🥒"];
$("plotBtn").addEventListener("click", e=>{
  const v = clickValue();
  S.coins += v; S.stats.totalEarned += v; S.stats.runEarned += v; S.stats.totalClicks++;
  $("plotBtn").textContent = VEG[Math.floor(Math.random()*VEG.length)];
  const f = document.createElement("div");
  f.className = "floatNum"; f.textContent = "+" + fmt(v);
  f.style.left = (e.clientX - 14 + (Math.random()*30-15)) + "px";
  f.style.top = (e.clientY - 26) + "px";
  document.body.appendChild(f); setTimeout(()=>f.remove(), 1000);
  const g = document.createElement("div");
  g.className = "floatVeg"; g.textContent = VEG[Math.floor(Math.random()*VEG.length)];
  g.style.left = (e.clientX - 40 + (Math.random()*40-20)) + "px";
  g.style.top = (e.clientY - 40) + "px";
  document.body.appendChild(g); setTimeout(()=>g.remove(), 1100);
  render();
});
$("buyModes").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  buyN = b.dataset.n === "max" ? "max" : parseInt(b.dataset.n, 10);
  document.querySelectorAll("#buyModes button").forEach(x=>x.classList.toggle("on", x===b));
  render();
});
$("festBtn").addEventListener("click", ()=>{
  const ps = pendingSeeds();
  if(ps < 1) return;
  if(!confirm(`确定开启丰收祭吗？将换得 ${ps} 颗金种子（永久 +${ps*5}% 产量），金币、菜园和技术会被清空，迎来新的一季。`)) return;
  const keep = { seeds:S.seeds + ps, totalEarned:S.stats.totalEarned, totalClicks:S.stats.totalClicks, fests:S.stats.fests + 1, playSec:S.stats.playSec };
  S = freshState();
  S.seeds = keep.seeds;
  S.stats.totalEarned = keep.totalEarned; S.stats.totalClicks = keep.totalClicks;
  S.stats.fests = keep.fests; S.stats.playSec = keep.playSec;
  save(); render();
});
$("wipeBtn").addEventListener("click", ()=>{
  if(!confirm("确定烧掉整个菜园重新种吗？存档会全部清空，不可恢复。")) return;
  localStorage.removeItem(SAVE_KEY);
  S = freshState(); save(); render();
});
$("offOk").addEventListener("click", ()=>{ $("modal").style.display = "none"; save(); });

/* ===== 主循环 + 自动存档 ===== */
buildUI();
const off = load();
render();
if(off){ $("offTime").textContent = fmtTime(off.away); $("offGain").textContent = fmt(off.gain); $("modal").style.display = "flex"; }
let last = performance.now();
setInterval(()=>{
  const now = performance.now();
  const dt = (now - last) / 1000; last = now;
  const gain = cps() * dt;
  if(gain > 0){ S.coins += gain; S.stats.totalEarned += gain; S.stats.runEarned += gain; }
  S.stats.playSec += dt;
  render();
}, 100);
setInterval(save, 5000);
window.addEventListener("beforeunload", save);
</script>
</body>
</html>
