<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>星核工场 · 增量游戏</title>
<style>
  :root{
    --bg:#0b0e1a; --panel:#151a2e; --panel2:#1c2340; --line:#2a3358;
    --text:#e8ecff; --muted:#8b94b8; --gold:#ffd34d; --accent:#6ee7ff;
    --good:#57e6a9; --warn:#ff7a90;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text);}
  header{position:sticky; top:0; z-index:5; background:linear-gradient(180deg,#11162a,#0b0e1a); padding:14px 16px 10px; border-bottom:1px solid var(--line);}
  .coins{font-size:30px; font-weight:800; color:var(--gold); line-height:1.1;}
  .sub{color:var(--muted); font-size:13px; margin-top:2px;}
  .sub b{color:var(--accent); font-weight:600;}
  main{max-width:640px; margin:0 auto; padding:14px 14px 40px;}
  #coreBtn{display:block; width:190px; height:190px; margin:18px auto 6px; border-radius:50%; border:3px solid #3b4a8a;
    background:radial-gradient(circle at 35% 35%, #7dd7ff, #2b6cff 55%, #16265e); color:#fff; font-size:22px; font-weight:800;
    box-shadow:0 0 42px rgba(80,150,255,.45); cursor:pointer; transition:transform .05s;}
  #coreBtn:active{transform:scale(.95);}
  .coreHint{text-align:center; color:var(--muted); font-size:13px; margin-bottom:16px;}
  .floatNum{position:fixed; z-index:9; color:var(--gold); font-weight:800; font-size:19px; pointer-events:none; animation:rise 1s ease-out forwards;}
  @keyframes rise{from{opacity:1; transform:translateY(0)} to{opacity:0; transform:translateY(-70px)}}
  .buyModes{display:flex; gap:8px; margin:10px 0;}
  .buyModes button{flex:1; padding:9px 0; border-radius:9px; border:1px solid var(--line); background:var(--panel); color:var(--muted); font-size:15px; cursor:pointer;}
  .buyModes button.on{background:var(--panel2); color:var(--gold); border-color:var(--gold); font-weight:700;}
  h2{font-size:16px; margin:22px 0 10px; color:var(--text);}
  .card{display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:11px 13px; margin-bottom:9px;}
  .card .info{flex:1; min-width:0;}
  .card .name{font-weight:700; font-size:15px;}
  .card .desc{color:var(--muted); font-size:12px; margin-top:2px;}
  .card .own{font-size:24px; font-weight:800; color:var(--muted); min-width:36px; text-align:center;}
  .buyBtn{border:none; border-radius:9px; padding:10px 13px; font-size:14px; font-weight:700; background:#2b6cff; color:#fff; cursor:pointer; white-space:nowrap;}
  .buyBtn:disabled{background:#232a49; color:#5b6488; cursor:not-allowed;}
  .buyBtn small{display:block; font-weight:500; font-size:11px; opacity:.85;}
  .upBtn{background:#0f7a55;}
  .upBtn:disabled{background:#232a49;}
  .prestige{background:linear-gradient(135deg,#241a4d,#151a2e); border:1px solid #4a3a8a; border-radius:12px; padding:15px;}
  .prestige .big{font-size:19px; font-weight:800; color:#c9a7ff;}
  #prestigeBtn{margin-top:10px; width:100%; padding:12px; border:none; border-radius:9px; background:#6d3df0; color:#fff; font-size:16px; font-weight:800; cursor:pointer;}
  #prestigeBtn:disabled{background:#232a49; color:#5b6488; cursor:not-allowed;}
  .stats{color:var(--muted); font-size:13px; line-height:1.9;}
  .stats b{color:var(--text);}
  .danger{background:none; border:1px solid var(--warn); color:var(--warn); border-radius:8px; padding:8px 14px; cursor:pointer; margin-top:14px;}
  #modal{position:fixed; inset:0; background:rgba(0,0,0,.65); display:none; align-items:center; justify-content:center; z-index:20;}
  #modal .box{background:var(--panel2); border-radius:14px; padding:24px; max-width:320px; text-align:center; border:1px solid var(--line);}
  #modal button{margin-top:14px; padding:10px 26px; border:none; border-radius:9px; background:#2b6cff; color:#fff; font-size:15px; font-weight:700; cursor:pointer;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<header>
  <div class="coins"><span id="coins">0</span> 金币</div>
  <div class="sub">每秒 <b id="cps">0</b> · 每次点击 <b id="clickVal">1</b> · 星核 <b id="cores">0</b>（产量 +<span id="coreBonus">0</span>%）</div>
</header>
<main>
  <button id="coreBtn">⚛️ 核心</button>
  <div class="coreHint">点击核心赚金币</div>

  <div class="buyModes" id="buyModes">
    <button data-n="1" class="on">×1</button>
    <button data-n="10">×10</button>
    <button data-n="100">×100</button>
    <button data-n="max">买满</button>
  </div>

  <h2>🏭 生产者</h2>
  <div id="producers"></div>

  <h2>⬆️ 升级</h2>
  <div id="upgrades"></div>
  <div id="noUpgrades" class="sub">暂无可购买的升级（继续攒金币 / 多买生产者解锁）</div>

  <h2>🌌 转生</h2>
  <div class="prestige">
    <div class="big">可获得星核：<span id="pendingCores">0</span></div>
    <div class="sub" style="margin-top:6px">转生会清空金币、生产者和升级，但每颗星核永久 +5% 全部产量。星核按本轮累计收入的平方根计算，赚得越多给得越多。</div>
    <button id="prestigeBtn">转生</button>
  </div>

  <h2>📊 统计</h2>
  <div class="stats" id="stats"></div>
  <button class="danger" id="wipeBtn">删除存档重开</button>
</main>

<div id="modal"><div class="box">
  <div style="font-size:18px;font-weight:800">欢迎回来！</div>
  <div class="sub" style="margin-top:8px">你不在的 <span id="offTime"></span> 里，生产者们赚了</div>
  <div style="font-size:24px;font-weight:800;color:var(--gold);margin-top:6px"><span id="offGain"></span> 金币</div>
  <button id="offOk">领取</button>
</div></div>

<script>
"use strict";
/* ===== 基础数据（路线图阶段1-2 的数值表） ===== */
const PRODUCERS = [
  { id:"cursor",  name:"自动点击器", icon:"👆", baseCost:15,       baseCps:0.1 },
  { id:"reactor", name:"小型反应堆", icon:"🔋", baseCost:100,      baseCps:1 },
  { id:"harvest", name:"能量采集器", icon:"📡", baseCost:1100,     baseCps:8 },
  { id:"fusion",  name:"聚变引擎",   icon:"🔥", baseCost:12000,    baseCps:47 },
  { id:"orbital", name:"轨道电站",   icon:"🛰️", baseCost:130000,   baseCps:260 },
  { id:"furnace", name:"恒星熔炉",   icon:"☀️", baseCost:1400000,  baseCps:1400 },
  { id:"dyson",   name:"戴森云节点", icon:"🌐", baseCost:20000000, baseCps:7800 },
  { id:"gate",    name:"星门矩阵",   icon:"🌀", baseCost:330000000,baseCps:44000 },
];
const COST_GROWTH = 1.15;

/* 升级：type=click 点击倍率 / producer 指定生产者倍率 / global 全局倍率 */
const UPGRADES = [
  { id:"click1", name:"强化点击 I",   desc:"点击收益 ×2",           cost:100,       type:"click", mult:2, cond:s=>true },
  { id:"click2", name:"强化点击 II",  desc:"点击收益 ×2",           cost:5000,      type:"click", mult:2, cond:s=>s.stats.totalClicks>=200 },
  { id:"click3", name:"强化点击 III", desc:"点击收益 ×2",           cost:500000,    type:"click", mult:2, cond:s=>s.stats.totalClicks>=800 },
  { id:"u_cursor",  name:"钛合金指尖", desc:"自动点击器产量 ×2",   cost:1000,      type:"producer", target:"cursor",  mult:2, cond:s=>s.owned.cursor>=10 },
  { id:"u_reactor", name:"超导线圈",   desc:"小型反应堆产量 ×2",   cost:8000,      type:"producer", target:"reactor", mult:2, cond:s=>s.owned.reactor>=10 },
  { id:"u_harvest", name:"广域天线阵", desc:"能量采集器产量 ×2",   cost:60000,     type:"producer", target:"harvest", mult:2, cond:s=>s.owned.harvest>=10 },
  { id:"u_fusion",  name:"磁约束升级", desc:"聚变引擎产量 ×2",     cost:600000,    type:"producer", target:"fusion",  mult:2, cond:s=>s.owned.fusion>=10 },
  { id:"u_orbital", name:"高效太阳翼", desc:"轨道电站产量 ×2",     cost:6000000,   type:"producer", target:"orbital", mult:2, cond:s=>s.owned.orbital>=10 },
  { id:"u_furnace", name:"恒星核心锁", desc:"恒星熔炉产量 ×2",     cost:60000000,  type:"producer", target:"furnace", mult:2, cond:s=>s.owned.furnace>=10 },
  { id:"u_dyson",   name:"蜂群协同",   desc:"戴森云节点产量 ×2",   cost:800000000, type:"producer", target:"dyson",   mult:2, cond:s=>s.owned.dyson>=10 },
  { id:"u_gate",    name:"维度校准",   desc:"星门矩阵产量 ×2",     cost:9000000000,type:"producer", target:"gate",    mult:2, cond:s=>s.owned.gate>=10 },
  { id:"g1", name:"能量学说",   desc:"全部产量 ×2", cost:200000,    type:"global", mult:2, cond:s=>s.stats.runEarned>=100000 },
  { id:"g2", name:"熵增逆转",   desc:"全部产量 ×2", cost:50000000,  type:"global", mult:2, cond:s=>s.stats.runEarned>=20000000 },
  { id:"g3", name:"宇宙常数微调", desc:"全部产量 ×2", cost:2000000000, type:"global", mult:2, cond:s=>s.stats.runEarned>=1000000000 },
];

const SAVE_KEY = "starcore-factory-v1";
const OFFLINE_CAP_SEC = 8 * 3600;

/* ===== 状态 ===== */
function freshState(){
  const owned = {}; PRODUCERS.forEach(p=>owned[p.id]=0);
  return {
    v:1, coins:0, cores:0, owned, upgrades:[],
    stats:{ totalEarned:0, runEarned:0, totalClicks:0, prestiges:0, playSec:0 },
    lastTime:Date.now()
  };
}
let S = freshState();

function save(){ S.lastTime = Date.now(); try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return 0;
    const d = JSON.parse(raw);
    if(!d || d.v !== 1) return 0;
    S = Object.assign(freshState(), d);
    S.owned = Object.assign(freshState().owned, d.owned||{});
    S.stats = Object.assign(freshState().stats, d.stats||{});
    /* 离线收益：按离开时长 × 当前每秒产出结算，上限 8 小时 */
    const away = Math.min((Date.now() - (d.lastTime||Date.now()))/1000, OFFLINE_CAP_SEC);
    const gain = cps() * away;
    if(away > 60 && gain > 0){
      S.coins += gain; S.stats.totalEarned += gain; S.stats.runEarned += gain;
      return { away, gain };
    }
  }catch(e){}
  return 0;
}

/* ===== 计算 ===== */
function prodMult(id){
  let m = 1;
  UPGRADES.forEach(u=>{ if(u.type==="producer" && u.target===id && S.upgrades.includes(u.id)) m *= u.mult; });
  return m;
}
function globalMult(){
  let m = 1 + S.cores * 0.05;
  UPGRADES.forEach(u=>{ if(u.type==="global" && S.upgrades.includes(u.id)) m *= u.mult; });
  return m;
}
function cps(){
  let sum = 0;
  PRODUCERS.forEach(p=>{ sum += S.owned[p.id] * p.baseCps * prodMult(p.id); });
  return sum * globalMult();
}
function clickValue(){
  let m = 1;
  UPGRADES.forEach(u=>{ if(u.type==="click" && S.upgrades.includes(u.id)) m *= u.mult; });
  return m * globalMult();
}
function unitCost(p){ return p.baseCost * Math.pow(COST_GROWTH, S.owned[p.id]); }
function bulkCost(p, n){ const c = unitCost(p); return c * (Math.pow(COST_GROWTH, n) - 1) / (COST_GROWTH - 1); }
function maxAffordable(p){
  const c = unitCost(p);
  if(S.coins < c) return 0;
  const n = Math.floor(Math.log((S.coins * (COST_GROWTH - 1)) / c + 1) / Math.log(COST_GROWTH));
  return Math.max(0, n);
}
function pendingCores(){
  return Math.floor(150 * Math.sqrt(S.stats.runEarned / 1e6)) - Math.floor(0); /* 本轮可得（与已得无关，转生时按本轮收入结算） */
}

/* ===== 格式化 ===== */
function fmt(n){
  if(n < 1000) return Math.floor(n).toString();
  const units = ["K","M","B","T","Qa","Qi","Sx","Sp"];
  let u = -1; while(n >= 1000 && u < units.length - 1){ n /= 1000; u++; }
  if(u >= units.length - 1 && n >= 1000) return n.toExponential(2).replace("e+","e");
  return (n >= 100 ? n.toFixed(0) : n >= 10 ? n.toFixed(1) : n.toFixed(2)) + units[u];
}
function fmtTime(sec){
  sec = Math.floor(sec);
  if(sec < 3600) return Math.floor(sec/60) + " 分钟";
  return Math.floor(sec/3600) + " 小时 " + Math.floor(sec%3600/60) + " 分钟";
}

/* ===== 渲染 ===== */
const $ = id => document.getElementById(id);
let buyN = 1;
const prodEls = {}, upEls = {};

function buildUI(){
  const wrap = $("producers");
  PRODUCERS.forEach(p=>{
    const el = document.createElement("div"); el.className = "card";
    el.innerHTML = `<div style="font-size:26px">${p.icon}</div>
      <div class="info"><div class="name">${p.name}</div>
      <div class="desc">每个每秒 +<span class="pcps"></span> 金币</div></div>
      <div class="own">0</div>
      <button class="buyBtn">购买<small></small></button>`;
    wrap.appendChild(el);
    prodEls[p.id] = { root:el, own:el.querySelector(".own"), btn:el.querySelector(".buyBtn"), pcps:el.querySelector(".pcps") };
    el.querySelector(".buyBtn").addEventListener("click", ()=>buyProducer(p));
  });
  const uw = $("upgrades");
  UPGRADES.forEach(u=>{
    const el = document.createElement("div"); el.className = "card hidden";
    el.innerHTML = `<div style="font-size:22px">⬆️</div>
      <div class="info"><div class="name">${u.name}</div><div class="desc">${u.desc}</div></div>
      <button class="buyBtn upBtn">购买<small>${fmt(u.cost)} 金币</small></button>`;
    uw.appendChild(el);
    upEls[u.id] = el;
    el.querySelector(".buyBtn").addEventListener("click", ()=>buyUpgrade(u));
  });
}

function render(){
  $("coins").textContent = fmt(S.coins);
  $("cps").textContent = fmt(cps());
  $("clickVal").textContent = fmt(clickValue());
  $("cores").textContent = S.cores;
  $("coreBonus").textContent = S.cores * 5;
  PRODUCERS.forEach(p=>{
    const e = prodEls[p.id];
    const n = buyN === "max" ? Math.max(1, maxAffordable(p)) : buyN;
    const cost = bulkCost(p, n);
    e.own.textContent = S.owned[p.id];
    e.pcps.textContent = fmt(p.baseCps * prodMult(p.id) * globalMult());
    e.btn.querySelector("small").textContent = fmt(cost) + " 金币";
    e.btn.firstChild.textContent = "购买 ×" + n + " ";
    e.btn.disabled = S.coins < bulkCost(p, 1) || (buyN !== "max" && S.coins < cost) || (buyN === "max" && maxAffordable(p) < 1);
    if(buyN === "max") e.btn.disabled = maxAffordable(p) < 1;
  });
  let anyUp = false;
  UPGRADES.forEach(u=>{
    const el = upEls[u.id];
    const visible = !S.upgrades.includes(u.id) && u.cond(S);
    el.classList.toggle("hidden", !visible);
    if(visible){ anyUp = true; el.querySelector(".buyBtn").disabled = S.coins < u.cost; }
  });
  $("noUpgrades").style.display = anyUp ? "none" : "block";
  const pc = pendingCores();
  $("pendingCores").textContent = pc;
  $("prestigeBtn").disabled = pc < 1;
  $("prestigeBtn").textContent = pc < 1 ? "转生（本轮收入达到 1M 后解锁）" : `转生，获得 ${pc} 颗星核`;
  $("stats").innerHTML =
    `本轮累计收入 <b>${fmt(S.stats.runEarned)}</b> · 历史总收入 <b>${fmt(S.stats.totalEarned)}</b><br>` +
    `总点击 <b>${S.stats.totalClicks}</b> 次 · 转生 <b>${S.stats.prestiges}</b> 次 · 游戏时长 <b>${fmtTime(S.stats.playSec)}</b>`;
}

/* ===== 操作 ===== */
function buyProducer(p){
  const n = buyN === "max" ? maxAffordable(p) : buyN;
  if(n < 1) return;
  const cost = bulkCost(p, n);
  if(S.coins < cost) return;
  S.coins -= cost; S.owned[p.id] += n; render();
}
function buyUpgrade(u){
  if(S.upgrades.includes(u.id) || S.coins < u.cost) return;
  S.coins -= u.cost; S.upgrades.push(u.id); render();
}
$("coreBtn").addEventListener("click", e=>{
  const v = clickValue();
  S.coins += v; S.stats.totalEarned += v; S.stats.runEarned += v; S.stats.totalClicks++;
  const f = document.createElement("div");
  f.className = "floatNum"; f.textContent = "+" + fmt(v);
  f.style.left = (e.clientX - 16 + (Math.random()*30-15)) + "px";
  f.style.top = (e.clientY - 24) + "px";
  document.body.appendChild(f);
  setTimeout(()=>f.remove(), 1000);
  render();
});
$("buyModes").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  buyN = b.dataset.n === "max" ? "max" : parseInt(b.dataset.n, 10);
  document.querySelectorAll("#buyModes button").forEach(x=>x.classList.toggle("on", x===b));
  render();
});
$("prestigeBtn").addEventListener("click", ()=>{
  const pc = pendingCores();
  if(pc < 1) return;
  if(!confirm(`确定转生吗？将获得 ${pc} 颗星核（永久 +${pc*5}% 产量），金币、生产者和升级会被清空。`)) return;
  S.cores += pc;
  const keep = { cores:S.cores, totalEarned:S.stats.totalEarned, totalClicks:S.stats.totalClicks, prestiges:S.stats.prestiges + 1, playSec:S.stats.playSec };
  S = freshState();
  S.cores = keep.cores;
  S.stats.totalEarned = keep.totalEarned; S.stats.totalClicks = keep.totalClicks;
  S.stats.prestiges = keep.prestiges; S.stats.playSec = keep.playSec;
  save(); render();
});
$("wipeBtn").addEventListener("click", ()=>{
  if(!confirm("确定删除全部存档重新开始吗？此操作不可恢复。")) return;
  localStorage.removeItem(SAVE_KEY);
  S = freshState(); save(); render();
});
$("offOk").addEventListener("click", ()=>{ $("modal").style.display = "none"; save(); });

/* ===== 主循环（时间戳差分）+ 自动存档 ===== */
buildUI();
const off = load();
render();
if(off){ $("offTime").textContent = fmtTime(off.away); $("offGain").textContent = fmt(off.gain); $("modal").style.display = "flex"; }
let last = performance.now();
setInterval(()=>{
  const now = performance.now();
  const dt = (now - last) / 1000; last = now;
  const gain = cps() * dt;
  if(gain > 0){ S.coins += gain; S.stats.totalEarned += gain; S.stats.runEarned += gain; }
  S.stats.playSec += dt;
  render();
}, 100);
setInterval(save, 5000);
window.addEventListener("beforeunload", save);
</script>
</body>
</html>
